    function hexToBytes(hex) {
    const clean = hex.replace(/^0x/i, "");
    if (clean.length % 2 !== 0) throw new Error("Invalid hex length");
    const out = new Uint8Array(clean.length / 2);
    for (let i = 0; i < out.length; i++) {
        out[i] = parseInt(clean.substr(i*2,2),16);
    }
    return out;
}

function bytesToHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2,"0")).join("");
}

function xor16(a,b){
    const out = new Uint8Array(16);
    for (let i=0;i<16;i++) out[i]=a[i]^b[i];
    return out;
}

function leftShiftOneBit128(block){
    const out = new Uint8Array(16);
    let carry = 0;
    for(let i=15;i>=0;i--){
        const val = (block[i]<<1)&0xFF;
        out[i] = val | carry;
        carry = (block[i]&0x80)?1:0;
    }
    return { out, carry };
}

function rbConst(){
    const Rb = new Uint8Array(16);
    Rb[15]=0x87;
    return Rb;
}

async function aesEncryptBlockAesCbc(keyRaw, block){
    const key = await crypto.subtle.importKey("raw", keyRaw, {name:"AES-CBC", length:128}, false, ["encrypt"]);
    const iv = new Uint8Array(16);
    const ct = await crypto.subtle.encrypt({name:"AES-CBC", iv}, key, block);
    return new Uint8Array(ct).slice(0,16);
}

async function aesCmac(keyRaw, message){
    const zero = new Uint8Array(16);
    const L = await aesEncryptBlockAesCbc(keyRaw, zero);
    const { out: K1tmp, carry: c1 } = leftShiftOneBit128(L);
    const K1 = c1 ? xor16(K1tmp, rbConst()) : K1tmp;
    const { out: K2tmp, carry: c2 } = leftShiftOneBit128(K1);
    const K2 = c2 ? xor16(K2tmp, rbConst()) : K2tmp;

    let lastBlock;
    if(message.length===16 && message.length%16===0){
        lastBlock = xor16(message,K1);
    } else {
        const m = new Uint8Array(16);
        m.set(message,0);
        m[message.length]=0x80;
        lastBlock = xor16(m,K2);
    }

    const tag = await aesEncryptBlockAesCbc(keyRaw,lastBlock);
    return tag;
}

async function generateRandomTag(secretHex){
    const key = hexToBytes(secretHex);
    if(key.length!==16) throw new Error("key_secret_hex must be 16 bytes (32 hex chars) for AES-128.");
    const date = Math.floor(Date.now()/1000);
    const view = new DataView(new ArrayBuffer(4));
    view.setUint32(0,date,true);
    const le4 = new Uint8Array(view.buffer);
    const message = le4.slice(1,4);
    const mac = await aesCmac(key,message);
    return bytesToHex(mac);
}
